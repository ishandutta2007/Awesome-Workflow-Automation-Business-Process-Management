<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%); border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      @keyframes floatPath {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.08); opacity: 0.65; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      @keyframes chipFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes chipFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      .animated-wire {
        stroke-dasharray: 12, 12;
        animation: floatPath 20s linear infinite;
      }
      .bg-halo {
        transform-origin: center;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .node-dot {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .floating-badge-1 {
        animation: chipFloat1 6s ease-in-out infinite;
      }
      .floating-badge-2 {
        animation: chipFloat2 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Dynamic Mesh / Glow Halos -->
  <circle cx="200" cy="80" r="140" fill="#4338ca" filter="blur(60px)" class="bg-halo"/>
  <circle cx="1000" cy="260" r="150" fill="#7c3aed" filter="blur(60px)" class="bg-halo"/>
  <circle cx="600" cy="300" r="120" fill="#be185d" filter="blur(70px)" class="bg-halo"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1050" y1="0" x2="1050" y2="340"/>
  </g>

  <!-- Ambient Animated Workflow Connections (in background behind text) -->
  <g opacity="0.35" fill="none" stroke="url(#glowGrad)" stroke-width="2">
    <path d="M 80,40 Q 300,120 520,30 T 960,80 T 1140,50" class="animated-wire"/>
    <path d="M 60,300 Q 280,220 580,310 T 940,240 T 1150,290" class="animated-wire" style="animation-direction: reverse; animation-duration: 25s;"/>
    <circle cx="80" cy="40" fill="#60a5fa" class="node-dot"/>
    <circle cx="520" cy="30" fill="#a78bfa" class="node-dot"/>
    <circle cx="960" cy="80" fill="#f472b6" class="node-dot"/>
    <circle cx="60" cy="300" fill="#38bdf8" class="node-dot"/>
    <circle cx="580" cy="310" fill="#818cf8" class="node-dot"/>
    <circle cx="940" cy="240" fill="#c084fc" class="node-dot"/>
  </g>

  <!-- Subdued Dynamic Interactive Pill Elements (positioned safely away from center text) -->
  <g class="floating-badge-1" opacity="0.75">
    <rect x="70" y="70" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="88" cy="86" r="5" fill="#10b981"/>
    <text x="102" y="91" fill="#94a3b8" font-size="12" font-weight="600">BPMN 2.0</text>
  </g>
  <g class="floating-badge-2" opacity="0.75">
    <rect x="990" y="65" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="1008" cy="81" r="5" fill="#3b82f6"/>
    <text x="1022" y="86" fill="#94a3b8" font-size="12" font-weight="600">AI AGENTS</text>
  </g>
  <g class="floating-badge-1" opacity="0.7">
    <rect x="80" y="240" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="98" cy="256" r="5" fill="#ec4899"/>
    <text x="112" y="261" fill="#94a3b8" font-size="12" font-weight="600">ORCHESTRATION</text>
  </g>
  <g class="floating-badge-2" opacity="0.7">
    <rect x="980" y="240" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="998" cy="256" r="5" fill="#f59e0b"/>
    <text x="1012" y="261" fill="#94a3b8" font-size="12" font-weight="600">EVENT-DRIVEN</text>
  </g>

  <!-- Foreground Title and Content (clean, crisp, completely unobstructed) -->
  <g text-anchor="middle" filter="url(#shadowFilter)">
    <!-- Category Pill -->
    <rect x="470" y="45" width="260" height="30" rx="15" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="65" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Workflow Automation
    </text>
    <text x="600" y="195" fill="#f8fafc" font-size="32" font-weight="700" letter-spacing="-0.3">
      &amp; Business Process Management
    </text>

    <!-- Subtitle / Meta -->
    <text x="600" y="245" fill="#94a3b8" font-size="16" font-weight="400">
      The definitive enterprise index for BPMN 2.0 Engines, Low-Code Automations, and Process Orchestration
    </text>

    <!-- Tags Row -->
    <g transform="translate(370, 275)" font-size="12" font-weight="600" fill="#cbd5e1">
      <text x="0" y="14">🚀 SaaS &amp; Cloud</text>
      <text x="115" y="14">•</text>
      <text x="145" y="14">🔓 Open-Source Engines</text>
      <text x="315" y="14">•</text>
      <text x="345" y="14">🤖 AI-Native Workflows</text>
    </g>
  </g>
</svg>